<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Test Pro — Face ID Indikator</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@latest/dist/face-api.js"></script>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: #111827;
            --text-light: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --emerald: #059669;
            --rose: #dc2626;
            --purple: #7c3aed;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-light); display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }

        .auth-card { width: 100%; max-width: 440px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 24px; padding: 32px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 16px; text-align: center; }
        .auth-card h1 { font-size: 1.4rem; font-weight: 800; color: var(--text-light); }
        .auth-card p { font-size: 0.85rem; color: var(--text-muted); }

        .form-group { display: flex; flex-direction: column; gap: 6px; text-align: left; }
        .form-group label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
        .form-group input { padding: 11px 14px; border: 1.5px solid var(--border-color); border-radius: 12px; font-size: 0.9rem; background: var(--bg-color); color: var(--text-light); outline: none; }
        .form-group input:focus { border-color: var(--primary); }

        .camera-box { position: relative; width: 100%; height: 160px; background: #000; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 2px dashed var(--border-color); transition: border-color 0.3s; }
        .camera-box.success { border-color: var(--emerald); }
        .camera-box.error { border-color: var(--rose); }

        video { width: 100%; height: 100%; object-fit: cover; position: absolute; }

        /* Vizual Pitichka va X belgisi uchun qatlam */
        .face-overlay { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 800; z-index: 10; background: rgba(0,0,0,0.6); color: #fff; transition: background 0.3s; }
        .face-overlay.success { background: var(--emerald); color: white; }
        .face-overlay.error { background: var(--rose); color: white; }

        .btn { background-color: var(--primary); color: white; border: none; border-radius: 12px; padding: 12px; font-size: 0.92rem; font-weight: 700; cursor: pointer; text-align: center; width: 100%; }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-emerald { background-color: var(--emerald); }
        .btn-emerald:hover { background-color: #047857; }

        .switch-link { font-size: 0.82rem; color: var(--text-muted); cursor: pointer; text-decoration: underline; margin-top: 4px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="auth-card" id="authCardContainer">
        <div style="font-size:0.75rem; font-weight:800; color:var(--purple); text-transform:uppercase;">Xavfsiz Autentifikatsiya</div>
        <h1 id="formTitle">Tizimga Kirish</h1>
        <p id="formSub">Dasturdan foydalanish uchun ma'lumotlaringizni kiriting va Face ID tekshiruvidan o'ting.</p>
        
        <div class="form-group hidden" id="groupFullName">
            <label>To'liq Ism va Familiyangiz</label>
            <input type="text" id="regFullName" placeholder="Masalan: Alisher Navoiy">
        </div>

        <div class="form-group">
            <label>Login</label>
            <input type="text" id="authLogin" placeholder="Loginingizni kiriting">
        </div>

        <div class="form-group">
            <label>Parol</label>
            <input type="password" id="authPassword" placeholder="Maxfiy parolingiz">
        </div>

        <div class="form-group">
            <label>Face ID (Yuz Skaneri)</label>
            <div class="camera-box" id="cameraBox">
                <video id="webcamVideo" autoplay playsinline muted></video>
                <div class="face-overlay" id="faceOverlay">?</div>
            </div>
            <div id="faceStatus" style="font-size: 0.75rem; color: var(--amber); margin-top: 4px;">AI kamera ishga tushirilmoqda...</div>
        </div>

        <button class="btn btn-emerald" id="authSubmitBtn" onclick="processAuth()">Kirish</button>
        <div class="switch-link" onclick="toggleMode()" id="switchModeText">Akkauntingiz yo'qmi? Ro'yxatdan o'tish</div>
    </div>

    <div class="auth-card hidden" id="successContainer">
        <h1 style="color: var(--emerald);">Muvaffaqiyatli Kirildi! 🎉</h1>
        <p id="welcomeUserText">Xush kelibsiz</p>
        <button class="btn" onclick="location.reload()">Chiqish (Reset)</button>
    </div>

    <script>
        let isRegister = false;
        let webcamStream = null;
        let aiReady = false;
        let faceDetectionInterval = null;

        window.onload = async () => {
            await initFaceAPI();
        };

        async function initFaceAPI() {
            try {
                document.getElementById('faceStatus').innerText = "Yuzni aniqlash modeli yuklanmoqda...";
                await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@latest/model/');
                aiReady = true;
                document.getElementById('faceStatus').innerText = "Face ID tayyor. Yuzingizni ko'rsating.";
                document.getElementById('faceStatus').style.color = "var(--emerald)";
            } catch (e) {
                document.getElementById('faceStatus').innerText = "Kamera ishlayapti (Standart rejim)";
                document.getElementById('faceStatus').style.color = "var(--text-muted)";
            }
            startCamera();
        }

        async function startCamera() {
            try {
                webcamStream = await navigator.mediaDevices.getUserMedia({ video: true });
                let videoEl = document.getElementById('webcamVideo');
                videoEl.srcObject = webcamStream;
                
                // Kamera ishlagach, har 600ms da yuzni real vaqtda tekshirib borish
                videoEl.onplaying = () => {
                    startRealtimeFaceCheck();
                };
            } catch (err) {
                document.getElementById('faceStatus').innerText = "Kameraga ruxsat berilmadi!";
                document.getElementById('faceStatus').style.color = "var(--rose)";
                setFaceIndicator(false, "Kamera yo'q");
            }
        }

        // Real vaqtda yuzni tekshirib pitichka yoki X chiqarish
        function startRealtimeFaceCheck() {
            let video = document.getElementById('webcamVideo');
            if(faceDetectionInterval) clearInterval(faceDetectionInterval);

            faceDetectionInterval = setInterval(async () => {
                if (!aiReady || !video) return;
                try {
                    let detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions());
                    if (detection) {
                        setFaceIndicator(true, "Yuz tasdiqlandi (Real)");
                    } else {
                        setFaceIndicator(false, "Yuz topilmadi / Soxta ko'rinish");
                    }
                } catch(err) {
                    console.error(err);
                }
            }, 700);
        }

        function setFaceIndicator(isValid, message) {
            let overlay = document.getElementById('faceOverlay');
            let box = document.getElementById('cameraBox');
            let status = document.getElementById('faceStatus');

            if (isValid) {
                overlay.innerText = "✓";
                overlay.className = "face-overlay success";
                box.className = "camera-box success";
                status.innerText = message;
                status.style.color = "var(--emerald)";
            } else {
                overlay.innerText = "✕";
                overlay.className = "face-overlay error";
                box.className = "camera-box error";
                status.innerText = message;
                status.style.color = "var(--rose)";
            }
        }

        function toggleMode() {
            isRegister = !isRegister;
            document.getElementById('formTitle').innerText = isRegister ? "Yangi Hisob Ochish" : "Tizimga Kirish";
            document.getElementById('formSub').innerText = isRegister ? "Ro'yxatdan o'tish uchun quyidagilarni to'ldiring." : "Dasturdan foydalanish uchun ma'lumotlaringizni kiriting.";
            document.getElementById('groupFullName').classList.toggle('hidden', !isRegister);
            document.getElementById('authSubmitBtn').innerText = isRegister ? "Ro'yxatdan o'tish" : "Kirish";
            document.getElementById('switchModeText').innerText = isRegister ? "Hisobingiz bormi? Kirish" : "Akkauntingiz yo'qmi? Ro'yxatdan o'tish";
        }

        async function processAuth() {
            let login = document.getElementById('authLogin').value.trim();
            let password = document.getElementById('authPassword').value.trim();
            let fullName = document.getElementById('regFullName').value.trim();

            if (!login || !password || (isRegister && !fullName)) {
                alert("Barcha maydonlarni to'ldirishingiz shart!");
                return;
            }

            if (aiReady) {
                let video = document.getElementById('webcamVideo');
                let detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions());
                if (!detection) {
                    alert("Xatolik: Kamerada haqiqiy yuz aniqlanmadi! Iltimos, yuzingizni aniq ko'rsating.");
                    return;
                }
            }

            let users = JSON.parse(localStorage.getItem('clean_users_db') || '[]');

            if (isRegister) {
                if (users.some(u => u.login === login)) {
                    alert("Bu login band qilingan. Boshqa login kiriting!");
                    return;
                }
                let newUser = { fullName, login, password };
                users.push(newUser);
                localStorage.setItem('clean_users_db', JSON.stringify(users));
                localStorage.setItem('clean_current_user', JSON.stringify(newUser));
                alert("Muvaffaqiyatli ro'yxatdan o'tdingiz!");
                showSuccess(newUser.fullName);
            } else {
                let found = users.find(u => u.login === login && u.password === password);
                if (login === 'admin' && password === 'admin123') {
                    found = { fullName: "Boshqaruvchi Admin", login: "admin" };
                }

                if (!found) {
                    alert("Login yoki parol xato! Yoki avval ro'yxatdan o'ting.");
                    return;
                }
                localStorage.setItem('clean_current_user', JSON.stringify(found));
                showSuccess(found.fullName);
            }
        }

        function showSuccess(name) {
            if (faceDetectionInterval) clearInterval(faceDetectionInterval);
            if (webcamStream) webcamStream.getTracks().forEach(t => t.stop());
            document.getElementById('authCardContainer').classList.add('hidden');
            document.getElementById('successContainer').classList.remove('hidden');
            document.getElementById('welcomeUserText').innerText = `Xush kelibsiz, ${name}! Face ID muvaffaqiyatli tasdiqlandi.`;
        }
    </script>
</body>
</html>
